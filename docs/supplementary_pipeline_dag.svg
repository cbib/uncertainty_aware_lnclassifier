<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <title>LNClassifier supplementary workflow DAGs</title>
  <desc>Independent benchmark above three feature-generation workflows. RNA outputs include rG4 detection and peak counts, plus ScanFold2 features; cross-workflow tables converge for downstream analyses and publication figures.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
