<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline diagram — compare versions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui, sans-serif; color: #172033; background: #edf1f6; }
  header { padding: 18px 24px; background: white; border-bottom: 1px solid #cbd5e1; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 8px 0; }
  button { font: inherit; padding: 7px 12px; cursor: pointer; border: 1px solid #94a3b8; border-radius: 5px; background: white; }
  button[aria-pressed="true"] { background: #172033; color: white; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  section { min-width: 0; background: white; border: 1px solid #cbd5e1; }
  h2 { margin: 0; padding: 12px; font-size: 17px; border-bottom: 1px solid #cbd5e1; }
  h2 a { float: right; font-size: 14px; font-weight: normal; }
  .viewport { overflow: auto; height: calc(100vh - 205px); }
  img { display: block; width: 100%; }
  @media (max-width: 750px) { main { grid-template-columns: 1fr; } .viewport { height: 65vh; } }
</style>
<header>
  <h1>Pipeline diagram comparison</h1>
  <p>V2 preserves panels A–D. Panel E uses explicit input references, restores embeddings and RF/SHAP, and groups publication outputs.</p>
  <button id="analysis" aria-pressed="true">Panel E</button>
  <button id="full" aria-pressed="false">Full diagram</button>
  <button id="zoom" aria-pressed="false">Larger view</button>
</header>
<main>
  <section><h2>V1 · Current <a href="supplementary_pipeline_dag.svg">Open SVG</a></h2>
    <div class="viewport"><img src="supplementary_pipeline_dag.svg" alt="Current pipeline diagram"></div></section>
  <section><h2>V2 · Explicit dependencies <a href="supplementary_pipeline_dag_v2.svg">Open SVG</a></h2>
    <div class="viewport"><img src="supplementary_pipeline_dag_v2.svg" alt="Proposed pipeline diagram with explicit input dependencies"></div></section>
</main>
<script>
  const panes = [...document.querySelectorAll('.viewport')];
  const images = [...document.querySelectorAll('img')];
  let focusAnalysis = true;
  function position() {
    panes.forEach((pane, i) => { pane.scrollTop = focusAnalysis ? 945 * images[i].clientWidth / 1900 : 0; });
  }
  document.querySelector('#analysis').onclick = () => {
    focusAnalysis = true;
    document.querySelector('#analysis').setAttribute('aria-pressed', 'true');
    document.querySelector('#full').setAttribute('aria-pressed', 'false');
    position();
  };
  document.querySelector('#full').onclick = () => {
    focusAnalysis = false;
    document.querySelector('#analysis').setAttribute('aria-pressed', 'false');
    document.querySelector('#full').setAttribute('aria-pressed', 'true');
    position();
  };
  document.querySelector('#zoom').onclick = function () {
    const enlarge = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(enlarge));
    images.forEach(img => img.style.width = enlarge ? '150%' : '100%');
    position();
  };
  images.forEach(img => img.addEventListener('load', position));
  window.addEventListener('resize', position);
  position();
</script>
</html>
